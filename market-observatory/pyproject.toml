[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-observatory"
version = "0.1.0"
description = "Evening market observatory for NIFTY: global money, FPI flows, derivatives positioning, volatility and news."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "lxml>=5",
]

[project.optional-dependencies]
llm = ["anthropic>=1,<2"]
dev = ["pytest>=8"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
